
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Contact Collector</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="contact-card">

            <h1>Contact Us</h1>

            <p class="subtitle">
                We'd love to hear from you
            </p>


            <form id="contactForm">

                <!-- Name -->
                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Message -->
                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        placeholder="Write your message..."
                        required
                    ></textarea>

                </div>


                <button type="submit">
                    Submit Contact
                </button>

            </form>


            <p id="responseMessage"></p>


            <a href="contacts.html" class="view-link">
                View All Contacts →
            </a>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
